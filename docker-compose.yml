services:

  backend:
    build: .
    container_name: financial_backend

    env_file:
      - .env

    volumes:
      - ./chroma_db:/app/chroma_db

    ports:
      - "8000:8000"

    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]


  frontend:
    build: .
    container_name: financial_frontend

    depends_on:
      - backend

    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"

    command:
      [
        "streamlit",
        "run",
        "frontend/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]
